[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/vedavision-data.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/vedavision.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/"
  to = "/vedavision.html"
  status = 200
