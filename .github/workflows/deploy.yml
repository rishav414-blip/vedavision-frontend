name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-deploy:
    name: Vite Build → Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Report build size
        run: |
          echo "### Build output" >> $GITHUB_STEP_SUMMARY
          du -sh dist/ >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Cloudflare Pages (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p ~/.config/.wrangler/config
          echo "$WRANGLER_CONFIG" > ~/.config/.wrangler/config/default.toml
          npx wrangler pages deploy dist/ --project-name vedavision-app --branch main
        env:
          WRANGLER_HOME: ~/.config/.wrangler
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ secrets.WRANGLER_CONFIG }}
