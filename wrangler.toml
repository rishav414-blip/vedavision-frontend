name = "vedavision-frontend"
compatibility_date = "2025-01-01"

# Serve the root directory as static assets — no build step required.
# This bypasses Cloudflare's automatic Vite Workers integration
# (which requires Vite 6+) since this is a plain static HTML site.
[assets]
directory = "."
not_found_handling = "single-page-application"
